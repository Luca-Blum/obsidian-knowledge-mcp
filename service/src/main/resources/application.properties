# One instance serves one Collection. Everything below "collection." defines which one.
collection.name=${COLLECTION_NAME}
collection.vault-path=${COLLECTION_VAULT_PATH}
collection.schema=${COLLECTION_SCHEMA}
collection.default-language=${COLLECTION_DEFAULT_LANGUAGE:en}
collection.mcp-port=${COLLECTION_MCP_PORT:8081}
# One bearer token per client, only from the environment: COLLECTION_AUTH_TOKENS_<CLIENT>=<token>
collection.embedding.model=${COLLECTION_EMBEDDING_MODEL:bge-m3}
collection.embedding.dimension=${COLLECTION_EMBEDDING_DIMENSION:1024}
collection.search.tool-description=${COLLECTION_SEARCH_TOOL_DESCRIPTION}
# A starting value for bge-m3, not yet calibrated with Negative Questions. Calibrate again after every model change
collection.search.minimum-similarity=${COLLECTION_SEARCH_MINIMUM_SIMILARITY:0.5}

quarkus.http.port=${collection.mcp-port}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=${collection.schema}
quarkus.flyway.default-schema=${collection.schema}
quarkus.flyway.placeholders.dimension=${collection.embedding.dimension}

quarkus.langchain4j.ollama.embedding-model.model-id=${collection.embedding.model}
quarkus.langchain4j.devservices.enabled=false

# Deployed: Postgres and Ollama come from the deploy configuration
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%prod.quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL}

# Local development: the engineering Collection from a Vault copy on the Mac
%dev.collection.name=engineering
%dev.collection.schema=engineering
%dev.collection.auth.tokens.dev=dev-token
%dev.collection.search.tool-description=Searches the User's engineering Collection (Obsidian Notes and Source Notes). \
'query' is the question in your own words (vector search, works across German and English). \
'keywords' are optional exact terms for the full-text search (class names, abbreviations, proper names), \
all of which must occur; without them the full-text search uses 'query'. Set 'topic' when the subject is clear. Cite the Note path of every hit you use.

%test.collection.name=test
%test.collection.vault-path=target/test-vault
%test.collection.schema=test_collection
%test.collection.reconciliation.enabled=false
%test.collection.embedding.model=unused
%test.collection.embedding.dimension=256
%test.collection.auth.tokens.claude-ai=test-token-claude-ai
%test.collection.auth.tokens.claude-code=test-token-claude-code
%test.collection.search.tool-description=Searches the test Collection.
# Test Notes are a few words per section, which the minimum would merge into one Chunk per Note
%test.collection.chunking.minimum-characters=0
# Small enough that a test Note of a few lines counts as long
%test.collection.reading.maximum-characters=200
%test.collection.reading.beginning-characters=50
# The fake embedding counts shared words, so a Chunk sharing no word with the query has similarity 0
%test.collection.search.minimum-similarity=0.1
# A local Ollama, as the evaluation needs it, would otherwise be asked at build time to pull the model "unused"
%test.quarkus.langchain4j.devservices.enabled=false

# Evaluation (EvaluationRun): the real model from a local Ollama against a local Vault copy (COLLECTION_VAULT_PATH).
# The model name must be the Pi's, so it comes from COLLECTION_EMBEDDING_MODEL like there.
%evaluation.collection.name=${COLLECTION_NAME:engineering}
%evaluation.collection.schema=evaluation
%evaluation.collection.reconciliation.enabled=false
%evaluation.collection.auth.tokens.evaluation=unused
%evaluation.collection.search.tool-description=Not offered during an evaluation.
%evaluation.quarkus.http.test-port=0
%evaluation.quarkus.langchain4j.ollama.timeout=120s
