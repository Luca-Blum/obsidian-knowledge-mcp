# Runs on the Raspberry Pi 5. The Deploy workflow starts it on every push to main.
name: knowledgebase

# What every Collection's service shares. A Collection's own service sets only its values and its sidecar: see
# "Add a Collection" in README.md
x-collection: &collection
  image: ${IMAGE:-ghcr.io/luca-blum/obsidian-knowledge-mcp:latest}
  restart: unless-stopped
  depends_on: &collection-dependencies
    postgres-init:
      condition: service_completed_successfully
    ollama:
      condition: service_healthy
    ollama-pull:
      condition: service_completed_successfully
  mem_limit: 900m
  healthcheck:
    # The runtime image has no curl, so speak HTTP through bash
    test:
      - CMD-SHELL
      - >-
        exec 3<>/dev/tcp/127.0.0.1/$${COLLECTION_MCP_PORT} &&
        printf 'GET /q/health/ready HTTP/1.0\r\n\r\n' >&3 &&
        head -n 1 <&3 | grep -q ' 200 '
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s

x-collection-environment: &collection-environment
  COLLECTION_VAULT_PATH: /vault
  # Every instance has its own network through its sidecar, so all use the port that tailscale/serve.json proxies to
  COLLECTION_MCP_PORT: 8081
  COLLECTION_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  COLLECTION_EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  DATABASE_URL: jdbc:postgresql://postgres:5432/knowledge
  OLLAMA_BASE_URL: http://ollama:11434
  # One chunk takes several seconds on the Pi's CPU, and longer while Ollama loads the model; the default is 10s
  QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120s}

# A Collection's own Tailscale node, which gives it the public origin https://knowledge-<collection>.<tailnet>.ts.net
# through Funnel on 443. The instance shares the sidecar's network and publishes no port on the host
x-tailscale-sidecar: &tailscale-sidecar
  image: tailscale/tailscale:stable
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9002/healthz"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s

x-tailscale-sidecar-environment: &tailscale-sidecar-environment
  # The node keeps its identity in TS_STATE_DIR, so the auth key is only used for the very first login
  TS_AUTH_ONCE: "true"
  TS_STATE_DIR: /var/lib/tailscale
  # tailscaled only takes requests and proxies them to the instance; nothing in the container connects out into the
  # tailnet. So it needs no tun device and no extra capabilities
  TS_USERSPACE: "true"
  # Read on every start, so Funnel survives a recreate of the sidecar
  TS_SERVE_CONFIG: /config/serve.json
  # Serves /healthz, which reports healthy once the node is in the tailnet
  TS_ENABLE_HEALTH_CHECK: "true"
  TS_LOCAL_ADDR_PORT: 127.0.0.1:9002

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gives every Collection its own role that owns its schema and sees no other's, then exits. Safe on every deploy
  postgres-init:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: knowledge
      PGUSER: knowledge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/init:ro
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --set=engineering_password=${ENGINEERING_DB_PASSWORD:?set in .env}
      - --set=training_password=${TRAINING_DB_PASSWORD:?set in .env}
      - --file=/init/isolate-collection.sql
      - --file=/init/collections.sql
    restart: "no"

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pulls the embedding model once into the shared volume, then exits
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-bge-m3}"]
    restart: "no"

  tailscale-engineering:
    <<: *tailscale-sidecar
    volumes:
      - ./tailscale:/config:ro
      - tailscale-engineering:/var/lib/tailscale
    environment:
      <<: *tailscale-sidecar-environment
      TS_HOSTNAME: knowledge-engineering
      TS_AUTHKEY: ${ENGINEERING_TS_AUTHKEY:?set in .env}

  knowledgebase-engineering:
    <<: *collection
    network_mode: "service:tailscale-engineering"
    depends_on:
      <<: *collection-dependencies
      tailscale-engineering:
        condition: service_healthy
    volumes:
      - ${ENGINEERING_VAULT_DIR:?set in .env}:/vault:ro
    environment:
      <<: *collection-environment
      COLLECTION_NAME: engineering
      COLLECTION_SCHEMA: engineering
      COLLECTION_SEARCH_TOOL_DESCRIPTION: ${ENGINEERING_SEARCH_TOOL_DESCRIPTION:?set in .env}
      COLLECTION_SEARCH_MINIMUM_SIMILARITY: ${ENGINEERING_SEARCH_MINIMUM_SIMILARITY:-0.56}
      # One bearer token per client; an empty one locks that client out
      COLLECTION_AUTH_TOKENS_CLAUDE_AI: ${ENGINEERING_TOKEN_CLAUDE_AI:-}
      COLLECTION_AUTH_TOKENS_CLAUDE_CODE: ${ENGINEERING_TOKEN_CLAUDE_CODE:-}
      # Password of the role engineering, which postgres-init creates (see postgres/isolate-collection.sql)
      DATABASE_PASSWORD: ${ENGINEERING_DB_PASSWORD}
      # Bounds the heap so that this instance fits next to the others, Postgres and Ollama in 8 GB
      JAVA_OPTS_APPEND: -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager ${ENGINEERING_HEAP:--Xmx512m}

  tailscale-training:
    <<: *tailscale-sidecar
    volumes:
      - ./tailscale:/config:ro
      - tailscale-training:/var/lib/tailscale
    environment:
      <<: *tailscale-sidecar-environment
      TS_HOSTNAME: knowledge-training
      TS_AUTHKEY: ${TRAINING_TS_AUTHKEY:?set in .env}

  knowledgebase-training:
    <<: *collection
    network_mode: "service:tailscale-training"
    depends_on:
      <<: *collection-dependencies
      tailscale-training:
        condition: service_healthy
    volumes:
      - ${TRAINING_VAULT_DIR:?set in .env}:/vault:ro
    environment:
      <<: *collection-environment
      COLLECTION_NAME: training
      COLLECTION_SCHEMA: training
      COLLECTION_SEARCH_TOOL_DESCRIPTION: ${TRAINING_SEARCH_TOOL_DESCRIPTION:?set in .env}
      COLLECTION_SEARCH_MINIMUM_SIMILARITY: ${TRAINING_SEARCH_MINIMUM_SIMILARITY:-0.5}
      # One bearer token per client; an empty one locks that client out
      COLLECTION_AUTH_TOKENS_CLAUDE_AI: ${TRAINING_TOKEN_CLAUDE_AI:-}
      COLLECTION_AUTH_TOKENS_CLAUDE_CODE: ${TRAINING_TOKEN_CLAUDE_CODE:-}
      # Password of the role training, which postgres-init creates (see postgres/isolate-collection.sql)
      DATABASE_PASSWORD: ${TRAINING_DB_PASSWORD}
      # Bounds the heap so that this instance fits next to the others, Postgres and Ollama in 8 GB
      JAVA_OPTS_APPEND: -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager ${TRAINING_HEAP:--Xmx512m}

volumes:
  postgres:
  ollama:
  tailscale-engineering:
  tailscale-training:
