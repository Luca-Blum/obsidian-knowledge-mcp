name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/luca-blum/obsidian-knowledge-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Test and package
        run: ./mvnw -B verify
        working-directory: service
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: service
          file: service/src/main/docker/Dockerfile.jvm
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # Runs on the self-hosted runner on the Pi and updates every Collection at once
  deploy:
    needs: image
    runs-on: [self-hosted, pi]
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the new image and wait until every instance is healthy
        env:
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: >-
          docker compose --file deploy/docker-compose.yml --env-file /srv/knowledgebase/.env
          up --detach --pull always --wait --wait-timeout 600
