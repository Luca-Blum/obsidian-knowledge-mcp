name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Test
        run: ./mvnw -B verify
        working-directory: service

  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: importer/uv.lock
      - name: Install LibreOffice for .doc, .rtf and .ppt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer libreoffice-impress
      - name: Cache the Docling models
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface
          key: docling-models-${{ hashFiles('importer/uv.lock') }}
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest --durations=10
